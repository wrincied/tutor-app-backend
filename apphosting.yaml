# Firebase App Hosting — Node.js API (tutor-app-backend)
# https://tutor-app-backend--tutorassis.europe-west4.hosted.app
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Разрешённые фронтенды для CORS (comma-separated).
env:
  - variable: FRONTEND_URL
    value: >-
      https://tutor-app--tutorassis.europe-west4.hosted.app,
      https://simple4u-64822.web.app,
      https://simple4u-64822.firebaseapp.com,
      https://tutorassis.web.app,
      https://tutorassis.firebaseapp.com,
      https://wrincied.github.io,
      https://simple4u.at,
      http://localhost:4200,
      http://localhost:4300,
      http://localhost:4400
    availability:
      - RUNTIME

  # GitHub Firebase UID(s) allowed for /api/admin (comma-separated).
  - variable: ADMIN_GITHUB_UIDS
    secret: ADMIN_GITHUB_UIDS
    availability:
      - RUNTIME

  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME

  - variable: CONTACT_EMAIL
    secret: CONTACT_EMAIL
    availability:
      - RUNTIME

  - variable: SMTP_HOST
    secret: SMTP_HOST
    availability:
      - RUNTIME

  - variable: SMTP_PORT
    secret: SMTP_PORT
    availability:
      - RUNTIME

  - variable: SMTP_USER
    secret: SMTP_USER
    availability:
      - RUNTIME

  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability:
      - RUNTIME

  - variable: EMAIL_FROM
    secret: EMAIL_FROM
    availability:
      - RUNTIME

# Stripe / Tribute / Firebase SA — Firebase Console → App Hosting → Environment
# (live keys are not in this repo; set STRIPE_* and TRIBUTE_* there).
