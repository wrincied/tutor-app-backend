# Firebase App Hosting — Node.js API (tutor-app-backend)
# https://tutor-app-backend--tutorassis.europe-west4.hosted.app
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Разрешённые фронтенды для CORS (comma-separated).
env:
  - variable: FRONTEND_URL
    value: >-
      https://tutor-app--tutorassis.europe-west4.hosted.app,
      https://simple4u-64822.web.app,
      https://simple4u-64822.firebaseapp.com,
      https://tutorassis.web.app,
      https://tutorassis.firebaseapp.com,
      https://wrincied.github.io,
      https://simple4u.at,
      http://localhost:4200,
      http://localhost:4300,
      http://localhost:4400
    availability:
      - RUNTIME

  # GitHub Firebase UID(s) allowed for /api/admin (comma-separated).
  - variable: ADMIN_GITHUB_UIDS
    secret: ADMIN_GITHUB_UIDS
    availability:
      - RUNTIME

# Остальные секреты (JWT, Stripe, Firebase SA) — в Firebase Console → App Hosting → Environment.