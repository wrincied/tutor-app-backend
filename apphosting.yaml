# Firebase App Hosting — Node.js API (tutor-app-backend)
# https://tutor-app-backend--tutorassis.europe-west4.hosted.app
runConfig:
  # Keep one warm instance so lesson auto-complete and Telegram reminders
  # are not delayed by App Hosting scale-to-zero.
  minInstances: 1
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Разрешённые фронтенды для CORS (comma-separated).
env:
  # First origin = Stripe/email redirects (primary SPA).
  - variable: FRONTEND_URL
    value: >-
      https://simple4u.at,
      https://www.simple4u.at,
      https://simple4u-64822.web.app,
      https://simple4u-64822.firebaseapp.com
    availability:
      - RUNTIME

  - variable: NODE_ENV
    secret: NODE_ENV
    availability:
      - RUNTIME

  - variable: DB_PROVIDER
    secret: DB_PROVIDER
    availability:
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability:
      - RUNTIME

  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME

  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability:
      - RUNTIME

  - variable: CONTACT_EMAIL
    secret: CONTACT_EMAIL
    availability:
      - RUNTIME

  - variable: SMTP_HOST
    secret: SMTP_HOST
    availability:
      - RUNTIME

  - variable: SMTP_PORT
    secret: SMTP_PORT
    availability:
      - RUNTIME

  - variable: SMTP_USER
    secret: SMTP_USER
    availability:
      - RUNTIME

  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability:
      - RUNTIME

  - variable: EMAIL_FROM
    secret: EMAIL_FROM
    availability:
      - RUNTIME

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_PRO
    secret: STRIPE_PRICE_ID_PRO
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_PRO_YEARLY
    secret: STRIPE_PRICE_ID_PRO_YEARLY
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_PRO_EARLY_YEARLY
    secret: STRIPE_PRICE_ID_PRO_EARLY_YEARLY
    availability:
      - RUNTIME

  - variable: STRIPE_COUPON_REFERRAL_20
    secret: STRIPE_COUPON_REFERRAL_20
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_PRO_MONTHLY
    secret: STRIPE_PRICE_ID_PRO_MONTHLY
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_BASIS
    secret: STRIPE_PRICE_ID_BASIS
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_BASIS_MONTHLY
    secret: STRIPE_PRICE_ID_BASIS_MONTHLY
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_BASIS_YEARLY
    secret: STRIPE_PRICE_ID_BASIS_YEARLY
    availability:
      - RUNTIME

  - variable: TRIBUTE_API_KEY
    secret: TRIBUTE_API_KEY
    availability:
      - RUNTIME

  - variable: BOT_USERNAME
    secret: BOT_USERNAME
    availability:
      - RUNTIME

  - variable: BOT_API_SECRET
    secret: BOT_API_SECRET
    availability:
      - RUNTIME

# Not set from local .env (local-only / placeholders):
# PORT, FRONTEND_URL (above), JWT_SECRET, TELEGRAM_BOT_TOKEN, BOT_API_URL (localhost)
# Country-specific STRIPE_PRICE_ID_* — add when created in Live Dashboard.
